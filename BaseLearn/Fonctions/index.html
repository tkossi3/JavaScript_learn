       // On crée un nombre entre 0 & 10
       // 3 essaie pour deviner le nombre
       //isRight(n)
       // guess()

        function getRandomInt(max) {
            return Math.floor(Math.random() * (max + 1))
        }
        const solution = getRandomInt(10)

        function isRight(n) {
            return solution === n
        }

        function guess() {
            const number = prompt('Entrez un nombre') * 1
            return isRight(number)
        }

        for (i = 0; i < 3; i++) {
            if(guess()) {
                console.log('Bravo')
                break;
            } else if (i === 2) {
                console.log('Vous avez perdu')
            }
        }

        function isPremier(n) {
            if (n < 2) {
                return false
            }
            for (let i = n - 1; i > 1; i--) {
                if (n % i === 0) {
                    return false
                }
            }
        }

        console.log(isPremier(0))
        console.log(isPremier(1))
        console.log(isPremier(2))
        console.log(isPremier(7))
        console.log(isPremier(11))
        console.log(isPremier(12))
        console.log(isPremier(13))
